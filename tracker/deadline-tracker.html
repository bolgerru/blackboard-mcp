<title>Term Deadline Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single timeline column — date gutter on the left, work on the right — grouped by urgency. */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --fg: #16212b;
  --muted: #5c6b78;
  --line: #dde3e8;
  --accent: #0e6b66;
  --accent-soft: #dcefed;
  --crit: #b4232c;
  --crit-soft: #fbe7e8;
  --warn: #9a5b00;
  --warn-soft: #fdf0d9;
  --ok: #2d6a32;
  --ok-soft: #e3f1e4;
  --chip: #eaeef2;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1519; --surface: #161e24; --fg: #e4eaee; --muted: #93a2ae; --line: #26323b;
    --accent: #5cc2b9; --accent-soft: #15302e; --crit: #ff7b82; --crit-soft: #3a1a1d;
    --warn: #f0b552; --warn-soft: #33270f; --ok: #7fc987; --ok-soft: #17291a; --chip: #1f2a32;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1519; --surface: #161e24; --fg: #e4eaee; --muted: #93a2ae; --line: #26323b;
  --accent: #5cc2b9; --accent-soft: #15302e; --crit: #ff7b82; --crit-soft: #3a1a1d;
  --warn: #f0b552; --warn-soft: #33270f; --ok: #7fc987; --ok-soft: #17291a; --chip: #1f2a32;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 920px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 64px; display: grid; gap: 28px; }
header { display: grid; gap: 6px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 5vw, 40px); line-height: 1.05; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.stamp { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
.stamp b { color: var(--fg); font-weight: 500; }

.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 2px; }
.stat .n { font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.stat.crit .n { color: var(--crit); }
.stat.warn .n { color: var(--warn); }

.brief { background: var(--accent-soft); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; }
.brief h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; margin: 0; color: var(--accent); font-weight: 600; }
.brief p { margin: 0; max-width: 70ch; }
.brief ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; }

.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.filters button, .toggle { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 4px 11px; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.filters button:focus-visible, .toggle:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.toggle { margin-left: auto; }

section.group { display: grid; gap: 8px; }
section.group > h2 { font-family: var(--font-display); font-weight: 500; font-size: 19px; margin: 0; display: flex; gap: 10px; align-items: baseline; }
section.group > h2 .count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
section.group.overdue > h2 { color: var(--crit); }

.row { display: grid; grid-template-columns: 92px 1fr auto; gap: 14px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.row.is-overdue { border-color: color-mix(in srgb, var(--crit) 45%, var(--line)); }
.row.is-done { opacity: 0.55; }
.row.is-done .title { text-decoration: line-through; }
.date { font-family: var(--font-mono); font-variant-numeric: tabular-nums; display: grid; gap: 1px; }
.date .d { font-size: 15px; font-weight: 500; }
.date .t { font-size: 12px; color: var(--muted); }
.date .rel { font-size: 11.5px; color: var(--accent); }
.row.is-overdue .date .rel { color: var(--crit); }
.main { min-width: 0; display: grid; gap: 5px; }
.title { font-weight: 600; font-size: 15.5px; overflow-wrap: anywhere; }
.title a { color: inherit; text-decoration-color: var(--line); text-underline-offset: 3px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; }
.chip { background: var(--chip); border-radius: 5px; padding: 1px 7px; font-family: var(--font-mono); font-size: 11.5px; }
.pill { border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 500; }
.pill.todo { background: var(--warn-soft); color: var(--warn); }
.pill.overdue { background: var(--crit-soft); color: var(--crit); }
.pill.submitted, .pill.done { background: var(--ok-soft); color: var(--ok); }
.row.is-submitted { opacity: 0.72; }
.row.is-submitted .date .rel { color: var(--muted); }

#views { gap: 4px; }
#views button { font-weight: 500; }
.jump { margin-left: auto; font-size: 13px; color: var(--accent); text-underline-offset: 3px; }
.jump:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.week { display: grid; gap: 8px; scroll-margin-top: 16px; }
.week > h2 { font-family: var(--font-display); font-weight: 500; font-size: 19px; margin: 0; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding-top: 10px; border-top: 1px solid var(--line); }
.week:first-child > h2 { border-top: 0; padding-top: 0; }
.wk-range { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
.wk-now { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; background: var(--accent); color: var(--bg); border-radius: 999px; padding: 1px 9px; }
.week > h2 .count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.week.current { background: var(--accent-soft); border-radius: 12px; padding: 10px 12px 12px; margin-inline: -12px; }
.week.current > h2 { border-top: 0; padding-top: 0; }
.week.past > h2 .wk-label { color: var(--muted); }
.wk-notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.wk-notes li { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; font-size: 13px; padding-left: 10px; border-left: 2px solid var(--line); }
.wk-note-label { font-weight: 600; }
.wk-note-text { color: var(--muted); min-width: 0; }
.wk-empty { margin: 0; font-size: 13px; color: var(--muted); }

.keydates { display: grid; gap: 8px; }
.keydates h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; margin: 0; color: var(--muted); font-weight: 600; }
.keydates ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.keydates li { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; display: grid; gap: 1px; min-width: 0; }
.kd-when { font-family: var(--font-mono); font-size: 12px; color: var(--accent); font-variant-numeric: tabular-nums; }
.kd-label { font-weight: 600; font-size: 14px; }
.kd-note { font-size: 12.5px; color: var(--muted); max-width: 46ch; }
.pill.graded { background: var(--accent-soft); color: var(--accent); }
.pill.unknown, .pill.inperson { background: var(--chip); color: var(--muted); }
.pill.tbc { background: var(--chip); color: var(--muted); border: 1px dashed var(--muted); }
.notes { font-size: 13.5px; color: var(--fg); max-width: 70ch; }
.source { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.done { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.done input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 28px 20px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--fg); font-family: var(--font-display); font-size: 18px; margin-bottom: 4px; }
.err { color: var(--crit); font-size: 13px; }

@media (max-width: 560px) {
  .row { grid-template-columns: 1fr auto; }
  .date { grid-column: 1 / -1; grid-auto-flow: column; justify-content: start; gap: 10px; align-items: baseline; }
  .toggle { margin-left: 0; }
}
@media (prefers-reduced-motion: no-preference) { .row { transition: opacity .2s; } }
</style>

<div class="wrap">
  <header>
    <h1>Term Deadline Tracker</h1>
    <div class="stamp" id="stamp">Waiting for the first Blackboard check…</div>
  </header>

  <div class="summary" id="summary" hidden></div>

  <div class="brief" id="brief" hidden>
    <h2>This morning's update</h2>
    <p id="brief-text"></p>
    <ul id="brief-changes" hidden></ul>
  </div>

  <section class="keydates" id="keydates" hidden>
    <h2>Key dates</h2>
    <ul id="keydates-list"></ul>
  </section>

  <div class="filters" id="views" hidden></div>
  <div class="filters" id="filters" hidden></div>

  <main id="list">
    <div class="empty"><strong>No deadlines loaded yet</strong>Claude fills this in from your Blackboard courses, slides and announcements, then refreshes it every morning.</div>
  </main>
  <p class="err" id="err" hidden></p>
</div>

<script>
(() => {
  const TZ = "Europe/Dublin";
  const DAY = 86400000;
  const state = { items: [], meta: null, course: "all", hideFinished: false, view: "weeks" };
  let db = null;
  try { state.hideFinished = localStorage.getItem("tracker.hideFinished") === "1"; } catch {}
  try { state.view = localStorage.getItem("tracker.view") === "next" ? "next" : "weeks"; } catch {}

  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const fmtDay = new Intl.DateTimeFormat("en-IE", { timeZone: TZ, weekday: "short", day: "numeric", month: "short" });
  const fmtTime = new Intl.DateTimeFormat("en-IE", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false });
  const fmtStamp = new Intl.DateTimeFormat("en-IE", { timeZone: TZ, weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit", hour12: false });
  const dayKey = (t) => new Intl.DateTimeFormat("en-CA", { timeZone: TZ }).format(new Date(t));

  function relative(due, now) {
    const days = Math.round((Date.parse(dayKey(due)) - Date.parse(dayKey(now))) / DAY);
    if (days === 0) return "today";
    if (days === 1) return "tomorrow";
    if (days === -1) return "yesterday";
    return days > 0 ? `in ${days} days` : `${-days} days ago`;
  }

  function effectiveStatus(it, now) {
    if (it.done && it.status !== "graded") return "done";
    if (it.status === "graded") return "graded";
    if (it.status === "submitted") return "submitted";
    if (!it.due) return "tbc";
    if (Date.parse(it.due) < now && it.status === "not_submitted" && !it.done) return "overdue";
    if (it.status === "not_submitted") return "todo";
    if (it.status === "in_person") return "inperson";
    return "unknown";
  }
  const STATUS_LABEL = { overdue: "Overdue", todo: "Not submitted", done: "✓ Done", submitted: "✓ Submitted", graded: "✓ Graded", inperson: "In class / exam", unknown: "Check Blackboard", tbc: "Date TBC" };

  const isFinished = (it) => !!it.done || it.status === "submitted" || it.status === "graded";

  // Every item sits in its date group; finished ones stay there, dimmed, so nothing disappears.
  function groupOf(it, now) {
    if (!it.due) return "tbc";
    const t = Date.parse(it.due);
    if (t < now) return effectiveStatus(it, now) === "overdue" ? "overdue" : "past";
    if (t - now <= 7 * DAY) return "week";
    if (t - now <= 14 * DAY) return "next";
    return "later";
  }
  const GROUPS = [
    ["overdue", "Overdue"], ["week", "Next 7 days"], ["next", "8–14 days away"], ["later", "Later this term"],
    ["tbc", "Date not set yet"], ["past", "Earlier this term"],
  ];

  function render() {
    const now = Date.now();
    const items = state.items;
    // Header + brief
    const m = state.meta;
    if (m?.lastUpdated) {
      $("stamp").innerHTML = "";
      $("stamp").append("Checked Blackboard ", Object.assign(el("b"), { textContent: fmtStamp.format(new Date(m.lastUpdated)) }));
      if (m.coverage) $("stamp").append(` · ${m.coverage}`);
    }
    if (m?.summary || m?.changes?.length) {
      $("brief").hidden = false;
      $("brief-text").textContent = m.summary || "";
      const ul = $("brief-changes"); ul.innerHTML = "";
      (m.changes || []).forEach((c) => ul.append(el("li", null, c)));
      ul.hidden = !(m.changes || []).length;
    }
    // Key dates (study week, exam period…) from meta/status.keyDates
    const kd = (m?.keyDates || []).filter((k) => k.kind !== "note" && Date.parse(k.end || k.start) >= now - DAY);
    $("keydates").hidden = !kd.length;
    const kdl = $("keydates-list"); kdl.innerHTML = "";
    kd.forEach((k) => {
      const li = el("li");
      const when = fmtDay.format(new Date(k.start)) + (k.end && dayKey(k.end) !== dayKey(k.start) ? " – " + fmtDay.format(new Date(k.end)) : "");
      li.append(el("span", "kd-when", when), el("span", "kd-label", k.label));
      if (k.note) li.append(el("span", "kd-note", k.note));
      kdl.append(li);
    });

    if (!items.length) return;

    // Summary tiles count only work still to do
    const open = items.filter((i) => !isFinished(i));
    const counts = {
      overdue: open.filter((i) => groupOf(i, now) === "overdue").length,
      week: open.filter((i) => groupOf(i, now) === "week").length,
      later: open.filter((i) => ["next", "later"].includes(groupOf(i, now))).length,
      tbc: open.filter((i) => groupOf(i, now) === "tbc").length,
    };
    const sum = $("summary"); sum.innerHTML = ""; sum.hidden = false;
    [["overdue", "Overdue", "crit"], ["week", "Due in 7 days", "warn"], ["later", "Later this term", ""], ["tbc", "Date not set", ""]].forEach(([k, l, c]) => {
      const s = el("div", "stat " + c); s.append(el("span", "n", String(counts[k])), el("span", "l", l)); sum.append(s);
    });

    // Course filters
    const courses = [...new Set(items.map((i) => i.courseCode || i.course))].sort();
    const f = $("filters"); f.innerHTML = ""; f.hidden = false;
    [["all", "All courses"], ...courses.map((c) => [c, c])].forEach(([v, l]) => {
      const b = el("button", null, l); b.type = "button"; b.setAttribute("aria-pressed", String(state.course === v));
      const full = items.find((i) => (i.courseCode || i.course) === v)?.course; if (full) b.title = full;
      b.onclick = () => { state.course = v; render(); }; f.append(b);
    });
    const t = el("button", "toggle", state.hideFinished ? "Show submitted" : "Hide submitted"); t.type = "button";
    t.onclick = () => { state.hideFinished = !state.hideFinished; try { localStorage.setItem("tracker.hideFinished", state.hideFinished ? "1" : "0"); } catch {} render(); };
    f.append(t);

    // View switch: whole term week by week, or what's due next
    const vs = $("views"); vs.innerHTML = ""; vs.hidden = false;
    [["weeks", "Week by week"], ["next", "What's due next"]].forEach(([v, l]) => {
      const b = el("button", null, l); b.type = "button"; b.setAttribute("aria-pressed", String(state.view === v));
      b.onclick = () => { state.view = v; try { localStorage.setItem("tracker.view", v); } catch {} render(); };
      vs.append(b);
    });
    if (state.view === "weeks") {
      const a = el("a", "jump", "Jump to this week ↓"); a.href = "#this-week"; vs.append(a);
    }

    const list = $("list"); list.innerHTML = "";
    const shown = items.filter((i) => (state.course === "all" || (i.courseCode || i.course) === state.course) && !(state.hideFinished && isFinished(i)));
    if (state.view === "weeks") return renderWeeks(list, shown, now, m);

    // Groups
    for (const [key, label] of GROUPS) {
      const rows = shown.filter((i) => groupOf(i, now) === key)
        .sort((a, b) => (Date.parse(a.due) || Infinity) - (Date.parse(b.due) || Infinity));
      if (!rows.length) continue;
      const sec = el("section", "group " + key);
      const h = el("h2", null, label); h.append(el("span", "count", String(rows.length)));
      sec.append(h);
      rows.forEach((it) => sec.append(renderRow(it, now)));
      list.append(sec);
    }
    if (!list.children.length) list.append(Object.assign(el("div", "empty"), { innerHTML: "<strong>Nothing open here</strong>No deadlines match this filter." }));
  }

  // ---- Week-by-week view of the whole term ----
  const fmtShort = new Intl.DateTimeFormat("en-IE", { timeZone: "UTC", day: "numeric", month: "short" });
  const addDays = (ymd, n) => new Date(Date.parse(ymd + "T12:00:00Z") + n * DAY).toISOString().slice(0, 10);
  const short = (ymd) => fmtShort.format(new Date(ymd + "T12:00:00Z"));

  function termBlocks(m) {
    const weeks = m?.term?.weeks || [];
    return weeks.map((w, i) => {
      const end = w.end || weeks[i + 1]?.start || addDays(w.start, 7); // exclusive
      const lastShown = w.end ? addDays(w.end, -1) : addDays(w.start, 4); // Mon–Fri for normal weeks
      return { label: w.label, start: w.start, end, range: `${short(w.start)} – ${short(lastShown)}` };
    });
  }

  function blockIndex(blocks, ymd) {
    if (!blocks.length || !ymd) return -1;
    if (ymd < blocks[0].start) return 0;
    for (let i = 0; i < blocks.length; i++) if (ymd >= blocks[i].start && ymd < blocks[i].end) return i;
    return blocks.length - 1;
  }

  function renderWeeks(list, shown, now, m) {
    const blocks = termBlocks(m);
    if (!blocks.length) { state.view = "next"; return render(); }
    const today = dayKey(now);
    const buckets = blocks.map(() => ({ rows: [], notes: [] }));
    const loose = [];
    for (const it of shown) {
      const ymd = it.due ? dayKey(it.due) : it.weekOf || null;
      const i = blockIndex(blocks, ymd);
      (i < 0 ? loose : buckets[i].rows).push(it);
    }
    for (const k of m?.keyDates || []) {
      const i = blockIndex(blocks, dayKey(k.start));
      if (i >= 0) buckets[i].notes.push(k);
    }
    const sortKey = (it) => (it.due ? Date.parse(it.due) : Date.parse((it.weekOf || "9999-12-31") + "T23:59:00Z") + 1);
    blocks.forEach((b, i) => {
      const isNow = today >= b.start && today < b.end;
      const isPast = today >= b.end;
      const sec = el("section", "week" + (isNow ? " current" : "") + (isPast ? " past" : ""));
      if (isNow) sec.id = "this-week";
      const h = el("h2");
      h.append(el("span", "wk-label", b.label), el("span", "wk-range", b.range));
      if (isNow) h.append(el("span", "wk-now", "This week"));
      const open = buckets[i].rows.filter((r) => !isFinished(r) && r.status !== "in_person").length;
      if (buckets[i].rows.length) h.append(el("span", "count", open ? `${open} to do` : "nothing left to do"));
      sec.append(h);
      if (buckets[i].notes.length) {
        const ul = el("ul", "wk-notes");
        buckets[i].notes.sort((a, c) => Date.parse(a.start) - Date.parse(c.start)).forEach((n) => {
          const li = el("li");
          li.append(el("span", "kd-when", fmtDay.format(new Date(n.start))), el("span", "wk-note-label", n.label));
          if (n.note) li.append(el("span", "wk-note-text", n.note));
          ul.append(li);
        });
        sec.append(ul);
      }
      const rows = buckets[i].rows.sort((a, c) => sortKey(a) - sortKey(c));
      if (rows.length) rows.forEach((it) => sec.append(renderRow(it, now)));
      else if (!buckets[i].notes.length) sec.append(el("p", "wk-empty", isPast ? "Nothing was due." : "Nothing due."));
      list.append(sec);
    });
    if (loose.length) {
      const sec = el("section", "week");
      const h = el("h2"); h.append(el("span", "wk-label", "No fixed date"), el("span", "count", String(loose.length)));
      sec.append(h);
      loose.forEach((it) => sec.append(renderRow(it, now)));
      list.append(sec);
    }
  }

  function renderRow(it, now) {
    const st = effectiveStatus(it, now);
    const row = el("article", "row" + (st === "overdue" ? " is-overdue" : "") + (it.done ? " is-done" : isFinished(it) ? " is-submitted" : ""));
    const date = el("div", "date");
    if (it.due) {
      date.append(el("span", "d", fmtDay.format(new Date(it.due))));
      if (!it.allDay) date.append(el("span", "t", fmtTime.format(new Date(it.due))));
      date.append(el("span", "rel", relative(it.due, now)));
    } else {
      date.append(el("span", "d", it.dueText || "TBC"));
    }
    const main = el("div", "main");
    const title = el("div", "title");
    if (it.link) { const a = el("a", null, it.title); a.href = it.link; a.target = "_blank"; a.rel = "noopener"; title.append(a); } else title.textContent = it.title;
    const meta = el("div", "meta");
    const chip = el("span", "chip", it.courseCode || it.course); chip.title = it.course || ""; meta.append(chip);
    if (it.kind) meta.append(el("span", null, it.kind));
    if (it.weight) meta.append(el("span", null, "· " + it.weight));
    meta.append(el("span", "pill " + st, STATUS_LABEL[st]));
    if (it.grade) meta.append(el("span", null, "Grade: " + it.grade));
    main.append(title, meta);
    if (it.notes) main.append(el("div", "notes", it.notes));
    if (it.sourceDetail) main.append(el("div", "source", "Found in: " + it.sourceDetail));

    const lab = el("label", "done");
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.id = "done-" + it.id; cb.checked = !!it.done;
    cb.disabled = !db;
    cb.onchange = async () => {
      cb.disabled = true;
      try { await db.doc("deadlines/" + it.id).update({ done: cb.checked, doneAt: cb.checked ? new Date().toISOString() : null }); $("err").hidden = true; }
      catch (e) { cb.checked = !cb.checked; $("err").hidden = false; $("err").textContent = "Couldn't save that tick. Check you're signed in to Claude and try again."; }
      finally { cb.disabled = false; }
    };
    lab.append(cb, document.createTextNode("Done"));
    row.append(date, main, lab);
    return row;
  }

  async function start() {
    try { db = window.claude?.use ? await window.claude.use("db") : null; } catch { db = null; }
    if (!db) { $("stamp").textContent = "Open this page signed in to Claude to see your deadlines."; return; }
    db.collection("deadlines").onSnapshot((snap) => {
      state.items = snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((i) => !i.hidden);
      render();
    }, () => { $("err").hidden = false; $("err").textContent = "Lost the connection to your deadline list. Reload the page."; });
    db.doc("meta/status").onSnapshot((snap) => { state.meta = snap.exists ? snap.data() : null; render(); });
    setInterval(render, 10 * 60 * 1000); // keep "in N days" and overdue current
  }
  start();
})();
</script>
